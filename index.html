<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AXIS Collect</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- ==================================================
         HEADER / NAVEGAÇÃO
         ================================================== -->

    <header>

        <nav>

            <a
                href="index.html"
                class="logo"
            >
                AXIS Collect
            </a>


            <ul class="nav-links">

                <li>
                    <a href="#home">
                        Início
                    </a>
                </li>

                <li>
                    <a href="#forms">
                        Formulários
                    </a>
                </li>

                <li>
                    <a href="create.html">
                        Criar formulário
                    </a>
                </li>

            </ul>

        </nav>

    </header>



    <!-- ==================================================
         HERO
         ================================================== -->

    <section
        class="hero"
        id="home"
    >

        <div class="hero-content">

            <h1>
                Crie formulários
                <span>do seu jeito.</span>
            </h1>


            <p>
                Crie, organize e gerencie seus
                formulários de maneira simples,
                prática e personalizada com o
                AXIS Collect.
            </p>


            <div class="hero-actions">

                <a
                    href="create.html"
                    class="button button-primary"
                >
                    Criar formulário
                </a>

            </div>

        </div>


        <!-- ==================================================
             LOGO
             ================================================== -->

        <div class="hero-logo">

            <!--
                Substitua "logo.png" pelo arquivo
                da logo oficial do AXIS Collect.
            -->

            <img
                src="collectlogo.png"
                alt="Logo do AXIS Collect"
            >

        </div>

    </section>



    <!-- ==================================================
         CONTEÚDO PRINCIPAL
         ================================================== -->

    <main id="forms">


        <!-- ==================================================
             CABEÇALHO DOS FORMULÁRIOS
             ================================================== -->

        <section class="section-header">

            <h2>
                Meus formulários
            </h2>

            <p>
                Acesse, edite e gerencie seus formulários.
            </p>

        </section>



        <!-- ==================================================
             LISTA DE FORMULÁRIOS

             IMPORTANTE:
             O ID "forms-list" é utilizado pelo script.js.
             ================================================== -->

        <section id="forms-list">

            <!--
                O JavaScript preencherá esta área
                automaticamente.
            -->

        </section>


    </main>



    <!-- ==================================================
         FOOTER
         ================================================== -->

    <footer>

        <p>
            AXIS Collect
        </p>

    </footer>



    <!-- ==================================================
         JAVASCRIPT
         ================================================== -->

    <script src="script.js"></script>

</body>

</html>
